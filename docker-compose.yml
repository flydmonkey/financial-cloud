services:
  mysql:
    image: mysql:9.7
    container_name: financial-cloud-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financial_cloud
      MYSQL_USER: financial_cloud
      MYSQL_PASSWORD: FinancialCloud321!
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - financial-cloud-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufinancial_cloud", "-pFinancialCloud321!"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  financial-cloud-mysql-data:
