name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit tests
        working-directory: financial-cloud
        run: ./mvnw test -Dtest='*Test' -DfailIfNoTests=false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - name: Install dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: ESLint
        working-directory: financial-cloud-ui
        run: npm run lint
      - name: Typecheck
        working-directory: financial-cloud-ui
        run: npm run typecheck
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: Install Playwright
        working-directory: financial-cloud-ui
        run: npx playwright install chromium --with-deps
      - name: Start backend
        working-directory: financial-cloud
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.arguments="--server.port=2154" &
          npx --yes wait-on http://localhost:2154/api/login/get --timeout 120000
      - name: Start frontend
        working-directory: financial-cloud-ui
        run: |
          npm run dev &
          npx --yes wait-on http://localhost:3154 --timeout 120000
      - name: Run E2E
        working-directory: financial-cloud-ui
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3154
