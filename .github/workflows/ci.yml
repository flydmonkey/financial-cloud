name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit tests
        working-directory: financial-cloud
        run: ./mvnw test -Dtest='*Test' -DfailIfNoTests=false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - name: Install dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: ESLint
        working-directory: financial-cloud-ui
        run: npm run lint
      - name: Typecheck
        working-directory: financial-cloud-ui
        run: npm run typecheck
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: Install Playwright
        working-directory: financial-cloud-ui
        run: npx playwright install chromium --with-deps
      - name: Start MySQL
        run: |
          docker compose up -d mysql
          npx --yes wait-on tcp:3307 --timeout 120000
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
      - name: Install Python deps for E2E book reset
        run: pip install pymysql
      - name: Initialize database schema
        run: python tools/run_init_sql.py
      - name: Build backend
        working-directory: financial-cloud
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: financial-cloud
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n1)
          echo "Starting $JAR"
          java -jar "$JAR" --server.port=2154 > ../backend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:2154/api/login/get --timeout 300000; then
            echo "==== backend log (tail) ===="
            tail -n 200 ../backend-ci.log || true
            exit 1
          fi
      - name: Start frontend
        working-directory: financial-cloud-ui
        run: |
          npm run dev > ../frontend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:3154 --timeout 120000; then
            echo "==== frontend log (tail) ===="
            tail -n 100 ../frontend-ci.log || true
            exit 1
          fi
      - name: Run E2E accounting suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:accounting
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_RESET_BOOK: '1'
      - name: Run E2E year-end suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:year-end
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_RESET_BOOK: '1'
