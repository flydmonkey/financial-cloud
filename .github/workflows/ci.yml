name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit tests
        working-directory: financial-cloud
        run: ./mvnw test -Dtest='*Test' -DfailIfNoTests=false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - name: Install dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: ESLint
        working-directory: financial-cloud-ui
        run: npm run lint
      - name: Typecheck
        working-directory: financial-cloud-ui
        run: npm run typecheck
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/financial-cloud-ui/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: Install Playwright
        working-directory: financial-cloud-ui
        run: npx playwright install chromium --with-deps
      - name: Start MySQL
        run: |
          docker compose up -d mysql
          npx --yes wait-on tcp:3307 --timeout 120000
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
      - name: Install Python deps for E2E book reset
        run: pip install pymysql
      - name: Initialize database schema
        run: python3 tools/run_init_sql.py
      - name: Build backend
        working-directory: financial-cloud
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: financial-cloud
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n1)
          echo "Starting $JAR"
          java -jar "$JAR" --server.port=2154 --financial-cloud.statement.balance-sheet.strict-trial-balance=true --financial-cloud.statement.income.strict-formula-validation=true --financial-cloud.statement.cash-flow.strict-reconciliation=true > ../backend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:2154/api/login/get --timeout 300000; then
            echo "==== backend log (tail) ===="
            tail -n 200 ../backend-ci.log || true
            exit 1
          fi
      - name: Start frontend
        working-directory: financial-cloud-ui
        run: |
          npm run dev > ../frontend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:3154/api/login/get --timeout 120000; then
            echo "==== frontend log (tail) ===="
            tail -n 100 ../frontend-ci.log || true
            exit 1
          fi
      - name: Smoke clear books + login via UI proxy
        run: |
          python3 tools/clear_books.py
          echo "backend:"
          curl -sf "http://localhost:2154/api/login/get?_allow_anonymous=true" | head -c 200
          echo
          echo "ui-proxy:"
          curl -sf "http://localhost:3154/api/login/get?_allow_anonymous=true" | head -c 200
          echo
          python3 - <<'PY'
          import json, urllib.request
          def login(base):
              init = json.load(urllib.request.urlopen(f"{base}/api/login/get?_allow_anonymous=true"))
              state = init["data"]["state"]
              req = urllib.request.Request(
                  f"{base}/api/login/signin?_allow_anonymous=true",
                  data=json.dumps({
                      "username": "admin",
                      "password": "maxkey",
                      "captcha": "",
                      "state": state,
                      "authType": "normal",
                  }).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              body = json.load(urllib.request.urlopen(req))
              assert body.get("code") == 0, body
              assert body["data"]["token"], body
              print(f"login ok via {base}")
          login("http://localhost:2154")
          login("http://localhost:3154")
          PY
          echo "browsers:"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" | head
          cd financial-cloud-ui
          npx playwright --version
          npx playwright test --list e2e/00-opening-balance-report.spec.ts
      - name: Run E2E accounting suite
        working-directory: financial-cloud-ui
        run: |
          set +e
          npm run test:e2e:accounting > ../e2e-accounting.log 2>&1
          code=$?
          cat ../e2e-accounting.log
          if [ $code -ne 0 ]; then
            echo "::error::E2E accounting suite exited with $code"
            # Surface the most useful lines in check annotations (readable without private logs).
            python3 - <<'PY'
          from pathlib import Path
          log = Path('../e2e-accounting.log')
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
          # Emit failure blocks around Error: lines (with nearby titles).
          emitted = 0
          for i, line in enumerate(lines):
              if 'Error:' not in line and '✘' not in line:
                  continue
              start = max(0, i - 8)
              end = min(len(lines), i + 6)
              for chunk in lines[start:end]:
                  print(f'::error::{chunk[:240]}')
                  emitted += 1
                  if emitted >= 40:
                      break
              if emitted >= 40:
                  break
          # Also emit the summary footer.
          for i, line in enumerate(lines):
              if 'failed' in line and 'passed' in ''.join(lines[max(0, i - 2): i + 3]):
                  for chunk in lines[max(0, i - 2): min(len(lines), i + 8)]:
                      print(f'::error::{chunk[:240]}')
                  break
          PY
            echo "==== last 80 lines of e2e log ===="
            tail -n 80 ../e2e-accounting.log
            {
              echo '## E2E accounting failure (last 80 lines)'
              echo '```'
              tail -n 80 ../e2e-accounting.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "==== frontend log (tail) ===="
            tail -n 80 ../frontend-ci.log || true
            echo "==== backend log (tail) ===="
            tail -n 80 ../backend-ci.log || true
          fi
          exit $code
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E year-end suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:year-end
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E balance sheet golden suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:balance-sheet-golden
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E income statement golden suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:income-golden
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
