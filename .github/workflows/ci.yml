name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit tests
        working-directory: financial-cloud
        run: ./mvnw test -Dtest='*Test' -DfailIfNoTests=false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - name: Install dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: ESLint
        working-directory: financial-cloud-ui
        run: npm run lint
      - name: Typecheck
        working-directory: financial-cloud-ui
        run: npm run typecheck
      - name: Unit tests (voucher workspace)
        working-directory: financial-cloud-ui
        run: npm run test:unit
      - name: AI UI regression scripts syntax check
        working-directory: financial-cloud-ui
        run: npm run test:ai-ui:scripts-check

  # PR 上完整 e2e 曾被 if:push 跳过（省时）。这里开最小冒烟；完整套件仍仅 push→main。
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'pull_request'
    env:
      FC_DB_NAME: financial_cloud_e2e_ci_smoke
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/financial_cloud_e2e_ci_smoke?allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
      FINANCIAL_CLOUD_BACKUP_SCHEDULE_ENABLED: 'false'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/financial-cloud-ui/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: Install Playwright
        working-directory: financial-cloud-ui
        run: npx playwright install chromium --with-deps
      - name: Start MySQL
        run: |
          docker compose up -d mysql
          npx --yes wait-on tcp:3307 --timeout 120000
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
      - name: Install Python deps for E2E book reset
        run: pip install pymysql
      - name: Initialize database schema
        run: python3 tools/run_init_sql.py
      - name: Build backend
        working-directory: financial-cloud
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: financial-cloud
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n1)
          java -jar "$JAR" --server.port=2154 --financial-cloud.statement.balance-sheet.strict-trial-balance=false --financial-cloud.statement.income.strict-formula-validation=true --financial-cloud.statement.cash-flow.strict-reconciliation=true > ../backend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:2154/api/login/get --timeout 300000; then
            tail -n 200 ../backend-ci.log || true
            exit 1
          fi
      - name: Start frontend
        working-directory: financial-cloud-ui
        run: |
          npm run dev > ../frontend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:3154/api/login/get --timeout 120000; then
            tail -n 100 ../frontend-ci.log || true
            exit 1
          fi
      - name: Smoke clear books + login
        run: |
          python3 tools/clear_books.py
          python3 - <<'PY'
          import json, urllib.request
          def login(base):
              init = json.load(urllib.request.urlopen(f"{base}/api/login/get?_allow_anonymous=true"))
              state = init["data"]["state"]
              req = urllib.request.Request(
                  f"{base}/api/login/signin?_allow_anonymous=true",
                  data=json.dumps({
                      "username": "admin",
                      "password": "changeme",
                      "captcha": "",
                      "state": state,
                      "authType": "normal",
                  }).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              body = json.load(urllib.request.urlopen(req))
              assert body.get("code") == 0, body
              print(f"login ok via {base}")
          login("http://localhost:2154")
          login("http://localhost:3154")
          PY
      - name: Run E2E smoke (opening-balance suite)
        working-directory: financial-cloud-ui
        run: npm run test:e2e:smoke
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: AI UI CI subset (fixture-gated)
        working-directory: financial-cloud-ui
        run: |
          # 空库无 AI-UI-20260930 夹具时跳过并写报告；有夹具则跑 section6+gaps+guards+export
          AI_UI_REQUIRE_BOOKS=0 npm run test:ai-ui:ci-subset
          if [ -f ../docs/testing/ai-ui-ci-subset-report.md ]; then
            {
              echo '## AI UI CI subset'
              cat ../docs/testing/ai-ui-ci-subset-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AI_UI_API: http://localhost:2154
          AI_UI_BASE: http://localhost:3154
          AI_UI_REQUIRE_BOOKS: '0'

  # 完整 e2e：仅 push（含合入 main）。PR 上见 e2e-smoke。
  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push'
    env:
      FC_DB_NAME: financial_cloud_e2e_ci_full
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/financial_cloud_e2e_ci_full?allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
      FINANCIAL_CLOUD_BACKUP_SCHEDULE_ENABLED: 'false'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/financial-cloud-ui/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: financial-cloud-ui/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: financial-cloud-ui
        run: npm install
      - name: Install Playwright
        working-directory: financial-cloud-ui
        run: npx playwright install chromium --with-deps
      - name: Start MySQL
        run: |
          docker compose up -d mysql
          npx --yes wait-on tcp:3307 --timeout 120000
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
      - name: Install Python deps for E2E book reset
        run: pip install pymysql
      - name: Initialize database schema
        run: python3 tools/run_init_sql.py
      - name: Build backend
        working-directory: financial-cloud
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: financial-cloud
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n1)
          echo "Starting $JAR"
          # 非 strict 模式保留真实总计；结转前核对差额与损益余额，结转后要求平衡。
          # strict 模式返回 513013，由后端单测及 Golden 分支覆盖。
          java -jar "$JAR" --server.port=2154 --financial-cloud.statement.balance-sheet.strict-trial-balance=false --financial-cloud.statement.income.strict-formula-validation=true --financial-cloud.statement.cash-flow.strict-reconciliation=true > ../backend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:2154/api/login/get --timeout 300000; then
            echo "==== backend log (tail) ===="
            tail -n 200 ../backend-ci.log || true
            exit 1
          fi
      - name: Start frontend
        working-directory: financial-cloud-ui
        run: |
          npm run dev > ../frontend-ci.log 2>&1 &
          if ! npx --yes wait-on http://localhost:3154/api/login/get --timeout 120000; then
            echo "==== frontend log (tail) ===="
            tail -n 100 ../frontend-ci.log || true
            exit 1
          fi
      - name: Smoke clear books + login via UI proxy
        run: |
          python3 tools/clear_books.py
          echo "backend:"
          curl -sf "http://localhost:2154/api/login/get?_allow_anonymous=true" | head -c 200
          echo
          echo "ui-proxy:"
          curl -sf "http://localhost:3154/api/login/get?_allow_anonymous=true" | head -c 200
          echo
          python3 - <<'PY'
          import json, urllib.request
          def login(base):
              init = json.load(urllib.request.urlopen(f"{base}/api/login/get?_allow_anonymous=true"))
              state = init["data"]["state"]
              req = urllib.request.Request(
                  f"{base}/api/login/signin?_allow_anonymous=true",
                  data=json.dumps({
                      "username": "admin",
                      "password": "changeme",
                      "captcha": "",
                      "state": state,
                      "authType": "normal",
                  }).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              body = json.load(urllib.request.urlopen(req))
              assert body.get("code") == 0, body
              assert body["data"]["token"], body
              print(f"login ok via {base}")
          login("http://localhost:2154")
          login("http://localhost:3154")
          PY
          echo "browsers:"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" | head
          cd financial-cloud-ui
          npx playwright --version
          npx playwright test --list e2e/00-opening-balance-report.spec.ts
      - name: Run balance sheet integrity regression
        working-directory: financial-cloud-ui
        run: npm run test:e2e:balance-sheet-integrity
        env:
          E2E_BASE_URL: http://localhost:3154
      - name: Run E2E accounting suite
        working-directory: financial-cloud-ui
        run: |
          set +e
          npm run test:e2e:accounting > ../e2e-accounting.log 2>&1
          code=$?
          cat ../e2e-accounting.log
          if [ $code -ne 0 ]; then
            echo "::error::E2E accounting suite exited with $code"
            # Surface the most useful lines in check annotations (readable without private logs).
            python3 - <<'PY'
          from pathlib import Path
          log = Path('../e2e-accounting.log')
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
          # Emit failure blocks around Error: lines (with nearby titles).
          emitted = 0
          for i, line in enumerate(lines):
              if 'Error:' not in line and '✘' not in line:
                  continue
              start = max(0, i - 8)
              end = min(len(lines), i + 6)
              for chunk in lines[start:end]:
                  print(f'::error::{chunk[:240]}')
                  emitted += 1
                  if emitted >= 40:
                      break
              if emitted >= 40:
                  break
          # Also emit the summary footer.
          for i, line in enumerate(lines):
              if 'failed' in line and 'passed' in ''.join(lines[max(0, i - 2): i + 3]):
                  for chunk in lines[max(0, i - 2): min(len(lines), i + 8)]:
                      print(f'::error::{chunk[:240]}')
                  break
          PY
            echo "==== last 80 lines of e2e log ===="
            tail -n 80 ../e2e-accounting.log
            {
              echo '## E2E accounting failure (last 80 lines)'
              echo '```'
              tail -n 80 ../e2e-accounting.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "==== frontend log (tail) ===="
            tail -n 80 ../frontend-ci.log || true
            echo "==== backend log (tail) ===="
            tail -n 80 ../backend-ci.log || true
          fi
          exit $code
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E year-end suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:year-end
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E balance sheet golden suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:balance-sheet-golden
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run E2E income statement golden suite
        working-directory: financial-cloud-ui
        run: npm run test:e2e:income-golden
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_RESET_BOOK: '1'
      - name: Run independent accounting acceptance (no skips or retries)
        working-directory: financial-cloud-ui
        run: npm run test:acceptance:accounting
        env:
          E2E_BASE_URL: http://localhost:3154
          E2E_API_URL: http://localhost:2154
          E2E_COMPONENT_BASE_URL: http://localhost:3154
      - name: Save accounting acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-acceptance
          path: .e2e-run/accounting-acceptance/
          if-no-files-found: warn
      - name: AI UI CI subset (fixture-gated)
        working-directory: financial-cloud-ui
        run: |
          AI_UI_REQUIRE_BOOKS=0 npm run test:ai-ui:ci-subset
          if [ -f ../docs/testing/ai-ui-ci-subset-report.md ]; then
            {
              echo '## AI UI CI subset'
              cat ../docs/testing/ai-ui-ci-subset-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AI_UI_API: http://localhost:2154
          AI_UI_BASE: http://localhost:3154
          AI_UI_REQUIRE_BOOKS: '0'

  verification-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFICATION_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install 'PyMySQL[rsa]==1.1.2' 'PyYAML==6.0.3'
      - name: Run evidence tool tests
        run: python -B tools/run_verification_ci_tests.py --scope evidence --output .e2e-run/verification-tools/evidence
      - name: Run payroll SQL offline boundary tests
        run: python -B tools/run_verification_ci_tests.py --scope sql --output .e2e-run/verification-tools/sql
      - name: Run payroll initializer safety tests
        run: python -B tools/run_verification_ci_tests.py --scope safety --output .e2e-run/verification-tools/safety
      - name: Save verification tools evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-run/verification-tools/
          if-no-files-found: error

  payroll-mysql-it:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FC_DB_HOST: 127.0.0.1
      FC_DB_PORT: '3307'
      FC_DB_NAME: financial_cloud_e2e_20261003_it4_ci_${{ github.run_id }}_${{ github.run_attempt }}
      FC_DB_USER: root
      FC_DB_PASSWORD: root
      VERIFICATION_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      mysql:
        image: mysql:9.4.0-oraclelinux9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install payroll integration dependencies
        run: python -m pip install 'PyMySQL[rsa]==1.1.2'
      - name: Initialize payroll IT schema
        id: payroll-schema
        run: python -B tools/init_payroll_it_schema.py --output .e2e-run/payroll-mysql-it/schema-init.json
      - name: Verify payroll IT environment
        run: python -B tools/init_payroll_it_schema.py --observe --output .e2e-run/payroll-mysql-it/database-before.json
      - name: Prepare payroll transaction evidence
        id: payroll-evidence
        run: |
          python -B tools/verify_payroll_ci_reports.py prepare --report-dir financial-cloud/target/surefire-reports --output .e2e-run/payroll-mysql-it
          python -B - <<'PY'
          import json, os, re
          from pathlib import Path
          record = json.loads(Path('.e2e-run/payroll-mysql-it/run.json').read_text(encoding='utf-8'))
          outputs = {
              'run_nonce': record['runNonce'],
              'checkout_sha': record['before']['source']['commitSha'],
              'source_fingerprint': record['before']['source']['fingerprint'],
          }
          if any(not isinstance(value, str) or not re.fullmatch(r'[0-9a-f]+', value) for value in outputs.values()):
              raise SystemExit('Payroll execution identity must consist of hexadecimal values')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in outputs.items():
                  handle.write(f'{key}={value}\n')
          PY
      - name: Run payroll MySQL transaction integration
        id: payroll-tests
        working-directory: financial-cloud
        run: |
          set -o pipefail
          set +e
          ./mvnw -B test -Dtest=PayrollTransactionMysqlIT '-Dverification.run.nonce=${{ steps.payroll-evidence.outputs.run_nonce }}' '-Dverification.checkout.sha=${{ steps.payroll-evidence.outputs.checkout_sha }}' '-Dverification.source.fingerprint=${{ steps.payroll-evidence.outputs.source_fingerprint }}' 2>&1 | tee ../.e2e-run/payroll-mysql-it/maven.log
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Observe payroll IT cleanup
        if: always() && steps.payroll-schema.outcome == 'success'
        run: python -B tools/init_payroll_it_schema.py --observe --output .e2e-run/payroll-mysql-it/database-after.json
      - name: Validate payroll IT reports
        if: always() && steps.payroll-evidence.outcome == 'success'
        run: python -B tools/verify_payroll_ci_reports.py verify --report-dir financial-cloud/target/surefire-reports --output .e2e-run/payroll-mysql-it --command-exit '${{ steps.payroll-tests.outputs.exit_code }}'
      - name: Save payroll integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-mysql-it-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .e2e-run/payroll-mysql-it/
            financial-cloud/target/surefire-reports/
          if-no-files-found: error
